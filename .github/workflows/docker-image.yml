name: CI/CD Docker

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GestionOrdinateurs.slnx

      - name: Build solution
        run: dotnet build GestionOrdinateurs.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test GestionOrdinateurs.slnx --configuration Release --no-build --verbosity normal

  docker:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: tests
    environment: dev
    env:
      DOCKER_ACCOUNT: ${{ secrets.DOCKER_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Docker Hub account
        run: test -n "$DOCKER_ACCOUNT"

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login --username "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build images
        run: docker compose build

      - name: Push application images
        run: docker compose push gestionordinateurs-api authentification-api gateway client
